version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gatsby:
        patterns:
          - "gatsby"
          - "gatsby-*"
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "gatsby"
          - "gatsby-*"
      development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
